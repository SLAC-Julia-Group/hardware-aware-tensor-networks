name: cascaded_tn_autoencoder
description: "56\u219219\u21927\u21923 autoencoder with automatic spacing"
data_type: float
input:
  sites: 56
  features: 2
  embedding: trigonometric
hardware:
  pipeline_ii: 1
  array_partition_dims:
  - 2
  resource_sharing: false
  parallel_contractions: true
layers:
- name: layer1
  input_sites: 56
  output_sites: 19
  phys_in: 2
  phys_out: 2
  bond_dim: 8
  weight_name: weights1
  optimize_non_output: true
  truncation:
    enabled: false
- name: layer2
  input_sites: 19
  output_sites: 7
  phys_in: 2
  phys_out: 2
  bond_dim: 6
  weight_name: weights2
  optimize_non_output: true
  truncation:
    enabled: false
    max_bond: 16
    method: slice
- name: layer3
  input_sites: 7
  output_sites: 3
  phys_in: 2
  phys_out: 2
  bond_dim: 4
  weight_name: weights3
  optimize_non_output: true
  truncation:
    enabled: false
    max_bond: 8
    method: slice
output:
  format: streaming
  final_layer: layer3
